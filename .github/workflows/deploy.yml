name: Build, Push and Deploy Frontend Ev2F

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: revisar codigo
        uses: actions/checkout@v4

      - name: log docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: compilar y subir imagen docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tienda-frontendev2f:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push 
    steps:
      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }} #comentario
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }} #comentario de prueba
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tienda-frontendev2f:latest
            sudo docker rm -f adoring_nobel || true
            sudo docker run -d -p 80:80 --name adoring_nobel ${{ secrets.DOCKERHUB_USERNAME }}/tienda-frontendev2f:latest